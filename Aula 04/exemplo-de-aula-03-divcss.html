<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo div com css</title>
    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal{
            background-color: cadetblue;
            border: 6.7px solid burlywood;
            color: rgb(114, 71, 150);
        }
        #secundaria{
            background-color: darkgreen;
            border: 6.7px solid cornflowerblue;
            color: coral;
        }
        hr{
            border: none;
            border-top: 30px solid gold;
            width: 67%;
         }
    </style>
</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha 
    </div>
    <hr/>
    <div id="secundaria">
        Esta é a outra divisão da página
        <br/>
        Aqui começa uma nova linha
    </div>
    <hr/>
    <div id="Piadocas">
        Peido molhado.com.br, sei la mano so quero escrever algo aleatorio
        <br>
    </div>
</body>
</html>
