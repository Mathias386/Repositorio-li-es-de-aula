<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript no head e no body</title>
</head>

<style>
    .destaque{
        color: rgb(25, 199, 19);
        font-size: 2rem;
        font-weight: bold;
        
    }
</style>
<script>
    alert("O JavaScript do meu cabeçalho foi executado!");
</script>
<body>
    <h1>JavaScript incorporado</h1>

    <p>Este conteúdo foi escrito diretamente no HTML!</p>

    <script>
        document.write(
            '<p class="destaque">Este conteúdo foi criado pelo JavaScript</p>',
        );
    </script>
</body>
</html>
